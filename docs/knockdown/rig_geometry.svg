<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Helvetica,Arial,sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b0b0b"/></marker></defs>
<rect width="980" height="600" fill="#fcfcfb"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#0b0b0b">SpiRob knockdown rig — geometry (all dimensions in mm)</text>
<text x="20" y="46" fill="#52514e">Left: side elevation along the robot's rest axis (scale 1.2 px/mm). Right: top view (camera image plane), frame C.</text>
<!-- ===== side elevation; X(v)=80+1.2*(v+12), Z(z)=520-1.2*z ===== -->
<line x1="40" y1="520" x2="500" y2="520" stroke="#8a6a45" stroke-width="3"/>
<text x="44" y="538" fill="#8a6a45">table (cardboard, brown)</text>
<rect x="44" y="404" width="22" height="116" fill="#d9d8d3" stroke="#52514e"/>
<text x="40" y="398" fill="#52514e" font-size="11">mount</text>
<!-- model plane -->
<line x1="66" y1="412" x2="352" y2="412" stroke="#2a78d6" stroke-dasharray="6 4"/>
<text x="356" y="425" fill="#2a78d6" font-size="11">model plane z = 90</text>
<!-- real drooping robot: base top 88 -> tip top 70 -->
<path d="M66 414.4 L352 436 L352 442 L66 438.4 Z" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="72" y="498" fill="#0b0b0b" font-size="11">real robot (white),</text><text x="72" y="511" fill="#0b0b0b" font-size="11">droops toward the tip</text>
<circle cx="80" cy="425" r="3" fill="#eb6834"/>
<text x="72" y="452" fill="#eb6834" font-size="11">base point</text>
<!-- pedestal + egg drawn at v = 110 (it actually sits 5-14 cm to the side) -->
<g opacity="0.85">
<rect x="226.8" y="474.4" width="19.2" height="45.6" fill="#f4f4f2" stroke="#0b0b0b"/>
<rect x="219.6" y="464.8" width="33.6" height="9.6" fill="#f4f4f2" stroke="#0b0b0b"/>
<rect x="222" y="460" width="28.8" height="4.8" fill="#2a2a2a"/>
<rect x="230.4" y="400" width="12" height="60" fill="#2a2a2a"/>
<circle cx="236.4" cy="415.6" r="24" fill="#1a1a1a"/>
</g>
<text x="262" y="478" fill="#52514e" font-size="11">white pedestal, cup top 46</text>
<text x="262" y="378" fill="#0b0b0b" font-size="11">black egg: top 107, cap centre 87</text>
<!-- camera -->
<rect x="233" y="128" width="30" height="16" fill="#0b0b0b"/>
<text x="270" y="140" fill="#0b0b0b">camera, looking down</text>
<line x1="248" y1="144" x2="104" y2="415.6" stroke="#2a78d6" stroke-dasharray="3 4"/>
<line x1="248" y1="144" x2="392" y2="415.6" stroke="#2a78d6" stroke-dasharray="3 4"/>
<text x="330" y="300" fill="#2a78d6" font-size="11">field of view (provisional)</text>
<!-- dimensions -->
<line x1="470" y1="520" x2="470" y2="134.8" stroke="#0b0b0b" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="263" y1="134.8" x2="480" y2="134.8" stroke="#c3c2b7" stroke-dasharray="2 3"/>
<text x="476" y="330" fill="#0b0b0b" font-weight="bold">321</text>
<line x1="80" y1="100" x2="248" y2="100" stroke="#0b0b0b" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="80" y1="96" x2="80" y2="420" stroke="#c3c2b7" stroke-dasharray="2 3"/>
<line x1="248" y1="96" x2="248" y2="128" stroke="#c3c2b7" stroke-dasharray="2 3"/>
<text x="152" y="94" fill="#0b0b0b" font-weight="bold">140</text>
<text x="96" y="114" fill="#52514e" font-size="11">(horizontal; same vertical plane)</text>
<line x1="30" y1="520" x2="30" y2="414.4" stroke="#0b0b0b" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="4" y="470" fill="#0b0b0b" font-weight="bold">88</text>
<text x="4" y="484" fill="#52514e" font-size="10">base top</text>
<line x1="372" y1="520" x2="372" y2="436" stroke="#0b0b0b" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="378" y="488" fill="#0b0b0b" font-weight="bold">≈70</text>
<text x="378" y="502" fill="#52514e" font-size="10">tip top (droop)</text>
<!-- ===== top view; Xt(u)=760+0.85u, Yt(v)=80+0.85(v+12) ===== -->
<line x1="540" y1="60" x2="540" y2="580" stroke="#e6e5e0"/>
<text x="560" y="74" fill="#0b0b0b" font-weight="bold">Top view</text>
<rect x="590" y="98.7" width="340" height="200.6" fill="#2a78d6" opacity=".05" stroke="#2a78d6" stroke-dasharray="2 3"/>
<text x="594" y="294" fill="#2a78d6" font-size="10">camera view at egg height ≈ ±200 × ±118 (provisional)</text>
<rect x="752" y="72" width="16" height="17" fill="#ffffff" stroke="#0b0b0b"/>
<line x1="760" y1="89" x2="760" y2="273" stroke="#0b0b0b" stroke-width="7" stroke-linecap="round" opacity=".18"/>
<text x="766" y="282" fill="#52514e" font-size="10">robot at rest (D = 0), tip v ≈ 215</text>
<circle cx="760" cy="80" r="3" fill="#eb6834"/>
<text x="776" y="76" fill="#eb6834" font-size="10">base point (v = −12)</text>
<circle cx="760" cy="90.2" r="3" fill="#0b0b0b"/>
<text x="776" y="96" fill="#0b0b0b" font-size="10">frame C origin = joint 2 (v = 0)</text>
<path d="M752 199 H768 M760 191 V207" stroke="#2a78d6" stroke-width="2.4"/>
<line x1="768" y1="199" x2="884" y2="186" stroke="#2a78d6"/><text x="886" y="178" fill="#2a78d6" font-size="11">camera</text><text x="886" y="192" fill="#2a78d6" font-size="11">centre</text><text x="886" y="206" fill="#2a78d6" font-size="11">v ≈ 128</text>
<line x1="622" y1="80" x2="622" y2="199" stroke="#0b0b0b" marker-start="url(#a)" marker-end="url(#a)"/><line x1="616" y1="80" x2="752" y2="80" stroke="#c3c2b7" stroke-dasharray="2 3"/><line x1="616" y1="199" x2="752" y2="199" stroke="#c3c2b7" stroke-dasharray="2 3"/>
<text x="590" y="144" fill="#0b0b0b" font-weight="bold">140</text>
<rect x="641" y="133" width="80.8" height="110.5" fill="none" stroke="#0b0b0b" stroke-dasharray="5 3"/>
<rect x="798.3" y="133" width="80.8" height="110.5" fill="none" stroke="#0b0b0b" stroke-dasharray="5 3"/>
<text x="594" y="318" fill="#0b0b0b" font-size="10">dashed boxes: egg placement region |u| 45–140, v 50–180 (both sides)</text>
<line x1="600" y1="330" x2="650" y2="330" stroke="#0b0b0b" marker-end="url(#a)"/><text x="655" y="334">u</text>
<line x1="600" y1="330" x2="600" y2="372" stroke="#0b0b0b" marker-end="url(#a)"/><text x="604" y="384">v</text>
<text x="560" y="410" fill="#0b0b0b" font-size="11">D = L0 − L1 &gt; 0 curls the robot toward −u.</text>
<text x="560" y="428" fill="#0b0b0b" font-size="11">Real robot: base top 88, tip ≈ 70 (gravity droop).</text>
<text x="560" y="446" fill="#0b0b0b" font-size="11">Model: flat plane at 90 (base element 80–100).</text>
<text x="560" y="464" fill="#0b0b0b" font-size="11">Training lowers the model 0–15 mm at random to cover the droop.</text>
<text x="560" y="482" fill="#0b0b0b" font-size="11">Pedestal cup top 46 keeps ≥ 12 mm below the lowest real robot point.</text>
<text x="560" y="512" fill="#52514e" font-size="10">Confirmed by NYK (24 Oct): camera centre directly above the</text>
<text x="560" y="526" fill="#52514e" font-size="10">robot's rest axis, 140 mm from the base point toward the tip.</text>
</svg>
