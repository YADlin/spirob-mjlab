<text x="716" y="575" font-size="11">Fix the pedestal to the table: it does not move in sim.</text>
<text x="716" y="590" font-size="11">Cup top 46: 20 mm lower than the original (66)</text>
<text x="716" y="605" font-size="11">so the drooping real robot hits the egg, not the cup.</text>
